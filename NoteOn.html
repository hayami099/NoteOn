*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;height:100vh;overflow:hidden}
#side{width:240px;background:var(--side);padding:10px 6px;overflow:auto;flex-shrink:0;font-size:14px}

.kids{margin-left:26px}

.btn{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:14px}
#legal{position:fixed;right:14px;bottom:8px;font-size:11px;color:var(--sub);opacity:.8;z-index:4;pointer-events:none}

<body>
<nav id="side"></nav>
<main id="main">
  <div id="legal">브라우저에 자동 저장 · 파일명/기기 변경 전 전체 백업 · NoteOn</div>
  <div id="top"><div id="crumb"></div><div class="acts"><button id="bHist" title="페이지 기록">⏱ 기록</button><button id="bSearch" title="검색 (Ctrl+K)">🔍</button><button id="bTheme" title="다크 모드">🌙</button></div></div>
  <div id="page"><div id="icon"></div><div id="ptitle" contenteditable="true"></div><div id="blocks"></div></div>
</main>
<script>
"use strict";
// ── 데이터 모델: 노션 RecordMap과 같은 꼴 {id,type,properties:{title:[[글자]]},format,content:[자식 id],parent_id}
const KEY = "mynotion.v1";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
let db = load();
let cur = db.current || db.roots[0];
let selected = new Set();

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.blocks) return d; } catch (e) {}
  return seed();
}
function seed() {
  const d = { blocks: {}, roots: [], history: {} };
  const mk = (type, text, parent, extra = {}) => { const id = uid(); d.blocks[id] = Object.assign({ id, type, properties: { title: [[text]] }, format: {}, content: [], parent_id: parent }, extra); if (parent) d.blocks[parent].content.push(id); return id; };
  const home = mk("page", "시작하기", null, { format: { icon: "👋" } }); d.roots.push(home);
  mk("text", "여기는 <b>NoteOn</b>입니다. 원본 소스 코드 없이 만들었어요.", home);
  mk("callout", "빈 줄에서 <code>/</code> 를 눌러 보세요. 블록 메뉴가 열립니다.", home, { format: { icon: "💡" } });
  mk("sub_header", "할 일", home);
  mk("to_do", "슬래시 메뉴 써 보기", home, { format: { checked: true } });
  mk("to_do", "블록 왼쪽 ⋮⋮ 잡고 끌어서 순서 바꾸기", home);
  mk("to_do", "Ctrl+K 로 검색하기", home);
  const tg = mk("toggle", "마크다운 단축 입력", home);
  ["# 제목1 · ## 제목2 · ### 제목3", "- 글머리 · 1. 번호 · [] 할 일", "> 토글 · \" 인용 · ``` 코드 · --- 구분선"].forEach(t => mk("bulleted_list", t, tg));
  const sub = mk("page", "아이디어 메모", home, { format: { icon: "📝" } });
  mk("text", "페이지 안의 페이지도 됩니다.", sub);
  const dbid = mk("collection_view", "업무 목록", home, { format: { cols: ["이름", "상태", "날짜"], rows: [["기획서", "진행 중", "10월 15일"], ["썸네일", "완료", "10월 14일"]] } });
  d.current = home;
  return d;
}
let saveT;
function save(snapshot = true) {
  db.current = cur;
  localStorage.setItem(KEY, JSON.stringify(db));
  if (snapshot) { clearTimeout(saveT); saveT = setTimeout(() => snap(cur), 800); }
}
// ── 페이지 기록(원본에 없는 무제한 버전): 저장할 때마다 이 페이지 트리를 통째로 찍어 둔다
function subtree(id, out = {}) { const b = db.blocks[id]; if (!b) return out; out[id] = JSON.parse(JSON.stringify(b)); b.content.forEach(c => { if (db.blocks[c] && db.blocks[c].type !== "page") subtree(c, out); }); return out; }
function snap(pid) {
  const h = db.history[pid] = db.history[pid] || [];
  const s = JSON.stringify(subtree(pid));
  if (h.length && h[h.length - 1].s === s) return;
  h.push({ t: Date.now(), s });
  localStorage.setItem(KEY, JSON.stringify(db));
}
const T = b => (b.properties.title[0] || [""])[0];
const setT = (b, v) => { b.properties.title = [[v]]; };
const clean = sanitizeRich;
const plain = html => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent; };

// ── 블록 종류(노션 슬래시 메뉴 등록부처럼: key·이름·검색 키워드·아이콘·설명)
const TYPES = [
  ["text", "텍스트", "text plain 텍스트 글", "Aa", "일반 텍스트로 쓰기 시작하세요."],
  ["page", "페이지", "page 페이지 하위", "📄", "이 페이지 안에 하위 페이지를 만드세요."],
  ["to_do", "할 일 목록", "todo checkbox 할일 체크", "☑", "할 일 목록으로 작업을 추적하세요."],
  ["header", "제목1", "h1 heading1 제목 큰", "H1", "섹션 제목(대)"],
  ["sub_header", "제목2", "h2 heading2 제목 중간", "H2", "섹션 제목(중)"],
  ["sub_sub_header", "제목3", "h3 heading3 제목 작은", "H3", "섹션 제목(소)"],
  ["collection_view", "표 데이터베이스", "table database db 표 데이터베이스", "▦", "표 보기로 데이터베이스를 추가하세요."],
  ["bulleted_list", "글머리 기호 목록", "bullet list ul 글머리 목록", "•", "간단한 글머리 기호 목록을 만드세요."],
  ["numbered_list", "번호 매기기 목록", "numbered ol 번호 목록", "1.", "번호가 매겨진 목록을 만드세요."],
  ["toggle", "토글 목록", "toggle 토글 접기", "▸", "토글로 내용을 숨기고 펼치세요."],
  ["quote", "인용", "quote 인용", "❝", "인용문을 남기세요."],
  ["divider", "구분선", "divider hr 구분선 선", "—", "블록을 시각적으로 나누세요."],
  ["callout", "콜아웃", "callout 콜아웃 강조 박스", "💡", "눈에 띄게 쓰세요."],
  ["code", "코드", "code 코드", "</>", "코드 조각을 기록하세요."],
];
const TMAP = Object.fromEntries(TYPES.map(t => [t[0], t]));

// ── 렌더
const $ = s => document.querySelector(s);
function render(focusId, caret) {
  const p = db.blocks[cur];
  $("#icon").textContent = p.format.icon || "";
  $("#ptitle").innerHTML = T(p);
  const wrap = $("#blocks"); wrap.innerHTML = "";
  let n = 0;
  p.content.forEach((id, i) => { const b = db.blocks[id]; if (!b) return; n = b.type === "numbered_list" ? n + 1 : 0; wrap.appendChild(renderBlock(b, n)); });
  if (!p.content.length) { const id = addBlock(cur, "text", "", 0); db.blocks[id].format.autoPlaceholder=true; return render(id); }
  renderSide(); renderCrumb();
  if (focusId) focusBlock(focusId, caret);
}
function renderBlock(b, num) {
  const el = document.createElement("div");
  el.className = "blk t-" + b.type + (b.format.checked ? " done" : "") + (selected.has(b.id) ? " sel" : "");
  el.dataset.id = b.id;
  const h = document.createElement("div"); h.className = "hdl";
  h.innerHTML = '<i class="plus" title="아래에 블록 추가">+</i><i class="drag" draggable="true" title="끌어서 이동 · 클릭하면 선택">⋮⋮</i>';
  el.appendChild(h);
  const row = document.createElement("div"); row.className = "row"; el.appendChild(row);
  if (b.type === "divider") { row.innerHTML = "<hr>"; return el; }
  if (b.type === "page") { row.innerHTML = `<div class="pg">${b.format.icon || "📄"} <span>${plain(T(b)) || "제목 없음"}</span></div>`; row.onclick = () => go(b.id); return el; }
  if (b.type === "collection_view") { row.appendChild(renderDB(b)); return el; }
  if (b.type === "bulleted_list") row.insertAdjacentHTML("beforeend", '<span class="bul"></span>');
  if (b.type === "numbered_list") row.insertAdjacentHTML("beforeend", `<span class="num">${num}.</span>`);
  if (b.type === "to_do") { const c = document.createElement("span"); c.className = "chk"; c.innerHTML = `<input type="checkbox" ${b.format.checked ? "checked" : ""}>`; c.firstChild.onchange = e => { b.format.checked = e.target.checked; save(); render(); }; row.appendChild(c); }
  if (b.type === "toggle") { const t = document.createElement("span"); t.className = "tog" + (b.format.open ? " open" : ""); t.textContent = "▶"; t.onclick = () => { b.format.open = !b.format.open; save(false); render(); }; row.appendChild(t); }
  if (b.type === "callout") { const c = document.createElement("span"); c.className = "cic"; c.textContent = b.format.icon || "💡"; c.onclick = () => { const all = ["💡", "⚠️", "✅", "🔥", "📌", "❗"]; b.format.icon = all[(all.indexOf(c.textContent) + 1) % all.length]; save(); render(); }; row.appendChild(c); }
  const tx = document.createElement("div"); tx.className = "tx"; tx.contentEditable = "true"; if(b.type === "code") tx.textContent = T(b); else tx.innerHTML = T(b);
  tx.dataset.ph = b.type === "text" ? "글을 쓰거나 '/'를 눌러 명령어 사용" : (TMAP[b.type] || [])[1] || "";
  row.appendChild(tx);
  const kids = b.content.filter(id => db.blocks[id]);
  if (kids.length && (b.type !== "toggle" || b.format.open)) {
    const k = document.createElement("div"); k.className = "kids"; let n = 0;
    kids.forEach(id => { const c = db.blocks[id]; n = c.type === "numbered_list" ? n + 1 : 0; k.appendChild(renderBlock(c, n)); });
    el.appendChild(k);
  } else if (b.type === "toggle" && b.format.open && !kids.length) {
    const k = document.createElement("div"); k.className = "kids"; k.innerHTML = '<div class="tx" style="color:var(--sub);cursor:text">빈 토글입니다. 클릭해서 블록을 추가하세요.</div>';
    k.onclick = () => { const id = addBlock(b.id, "text", "", 0); save(); render(id); };
    el.appendChild(k);
  }
  return el;
}
function renderDB(b) {
  const box = document.createElement("div"); box.style.width = "100%";
  const f = b.format;
  box.innerHTML = `<div class="dbt" contenteditable="true">${T(b)}</div>`;
  box.firstChild.oninput = e => { setT(b, e.target.textContent); save(); renderSide(); };
  const t = document.createElement("table"); t.className = "db";
  t.innerHTML = "<tr>" + f.cols.map((c, i) => `<th contenteditable="true" data-c="${i}">${c}</th>`).join("") + '<th class="add" data-addcol>+</th></tr>' +
    f.rows.map((r, ri) => "<tr>" + f.cols.map((_, ci) => `<td contenteditable="true" data-r="${ri}" data-c="${ci}">${ci === 1 && r[ci] ? `<span class="tag">${r[ci]}</span>` : (r[ci] || "")}</td>`).join("") + "<td></td></tr>").join("");
  t.oninput = e => { const c = e.target.closest("td,th"); if (!c) return; if (c.tagName === "TH") f.cols[+c.dataset.c] = c.textContent; else f.rows[+c.dataset.r][+c.dataset.c] = c.textContent; save(); };
  t.onclick = e => { if (e.target.dataset.addcol !== undefined) { f.cols.push("속성 " + (f.cols.length + 1)); f.rows.forEach(r => r.push("")); save(); render(); } };
  box.appendChild(t);
  const add = document.createElement("div"); add.className = "add"; add.textContent = "+ 새로 만들기";
  add.onclick = () => { f.rows.push(f.cols.map(() => "")); save(); render(); };
  box.appendChild(add);
  return box;
}
function renderSide() {
  const s = $("#side");
  s.innerHTML = '<div class="ws"><b>N</b>NoteOn</div><div class="sbtn" id="sS">🔍 검색</div><div class="sbtn" id="sN">＋ 새 페이지</div><div class="sec">개인 페이지</div>';
  const tree = (id, depth) => {
    const b = db.blocks[id]; if (!b) return;
    const kids = b.content.filter(c => db.blocks[c] && db.blocks[c].type === "page");
    const r = document.createElement("div"); r.className = "trow" + (id === cur ? " on" : ""); r.style.paddingLeft = 6 + depth * 14 + "px";
    r.innerHTML = `<span class="arr">${kids.length ? (b.format.sopen ? "▾" : "▸") : ""}</span>${b.format.icon || "📄"} ${plain(T(b)) || "제목 없음"}`;
    r.onclick = e => { if (e.target.classList.contains("arr")) { b.format.sopen = !b.format.sopen; save(false); renderSide(); } else go(id); };
    s.appendChild(r);
    if (b.format.sopen) kids.forEach(k => tree(k, depth + 1));
  };
  db.roots.forEach(r => tree(r, 0));
  $("#sS").onclick = openSearch;
  $("#sN").onclick = () => { const id = uid(); db.blocks[id] = { id, type: "page", properties: { title: [[""]] }, format: { icon: "📄" }, content: [], parent_id: null }; db.roots.push(id); save(); go(id); };
}
function renderCrumb() {
  const path = []; let b = db.blocks[cur];
  while (b) { if (b.type === "page") path.unshift(b); b = db.blocks[b.parent_id]; }
  $("#crumb").innerHTML = path.map(p => `<span data-id="${p.id}">${p.format.icon || "📄"} ${plain(T(p)) || "제목 없음"}</span>`).join(" / ");
  $("#crumb").querySelectorAll("span").forEach(sp => sp.onclick = () => go(sp.dataset.id));
}
function go(id) { cur = id; let b = db.blocks[db.blocks[id].parent_id]; while (b) { b.format.sopen = true; b = db.blocks[b.parent_id]; } selected.clear(); save(false); render(); $("#main").scrollTop = 0; }

// ── 블록 조작
function addBlock(parent, type, text, index, extra = {}) {
  const id = uid();
  db.blocks[id] = { id, type, properties: { title: [[text]] }, format: Object.assign({}, extra), content: [], parent_id: parent };
  if (type === "collection_view") db.blocks[id].format = { cols: ["이름", "상태", "날짜"], rows: [["", "", ""]] };
  if (type === "page") db.blocks[id].format.icon = "📄";
  const p = db.blocks[parent]; p.content.splice(index, 0, id);
  return id;

 function prepare(id){if(done.has(id))return;if(active.has(id))throw Error('복원 위치에 순환 연결이 있습니다');active.add(id);const b=sim.blocks[id],o=b.trashOrigin||{};if(where==='original'&&selectedIds.has(o.parent))prepare(o.parent);if(sim.pageLocks?.[id])throw Error('잠긴 페이지는 잠금을 해제한 뒤 복원하세요');const parent=where==='root'?null:sim.blocks[o.parent]&&!simDead(o.parent)?o.parent:null;if(parent&&simLocked(parent))throw Error('원래 위치가 잠겨 있습니다. 최상위로 복원을 선택하거나 잠금을 해제하세요');b.trashed=false;b.parent_id=parent;const list=parent?sim.blocks[parent].content:sim.roots;const index=Math.max(0,Math.min(Number.isInteger(o.index)?o.index:list.length,list.length));if(!list.includes(id))list.splice(index,0,id);plan.push({id,parent,index});delete b.trashOrigin;done.add(id);active.delete(id)}ids.forEach(prepare);

 function draw(){list.replaceChildren();items.slice(0,limit).forEach((item,i)=>{const button=document.createElement('button');button.className='commandItem'+(i===active?' active':'');button.id='command-result-'+i;button.setAttribute('role','option');button.setAttribute('aria-selected',String(i===active));button.setAttribute('aria-disabled',String(!!item.disabled));button.tabIndex=-1;const caption=document.createElement('small');caption.textContent=item.kind+(item.page?' · '+title(item.page):'')+(item.disabled?' · '+item.reason:'');const text=document.createElement('span');text.append(highlightedText(item.text,input.value.trim().replace(/^>/,'')));button.append(caption,text);button.onclick=()=>execute(i);list.append(button)});if(items.length>limit)actionButton('결과 더 보기',()=>{limit+=60;draw()},list);count.textContent=items.length?items.length+'개 결과'+(items.length>limit?' · '+limit+'개 표시':''):'일치하는 페이지나 명령이 없습니다.';if(items[active])input.setAttribute('aria-activedescendant','command-result-'+active);else input.removeAttribute('aria-activedescendant')}
 function run(){items=commandResults(input.value,scope.value);active=Math.max(0,items.findIndex(x=>!x.disabled));limit=60;draw()}
 input.oninput=run;input.onkeydown=e=>{if(isIMEKey(e))return;if(e.isComposing)return;if(e.key==='Enter'){e.preventDefault();e.stopPropagation();execute(active)}else if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();e.stopPropagation();const len=Math.min(items.length,limit);if(!len)return;for(let n=0;n<len;n++){active=(active+(e.key==='ArrowDown'?1:len-1))%len;if(!items[active].disabled)break}draw();list.querySelector('.active')?.scrollIntoView({block:'nearest'})}};m.addEventListener('keydown',e=>{if(isIMEKey(e))return;if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}},true);run();input.focus();
}

 m.addEventListener('keydown',e=>{if(isIMEKey(e))return;if(e.key!=='Tab')return;const items=focusable(),first=items[0],last=items.at(-1);if(!first){e.preventDefault();box.focus()}else if(e.shiftKey&&(document.activeElement===first||!box.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!box.contains(document.activeElement))){e.preventDefault();first.focus()}});

function openReleaseInfo(){const {body}=dialog('NoteOn '+APP_VERSION+' · 사용 안내');for(const [title,text] of RELEASE_NOTES){const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=text;body.append(h,p)}actionButton('완성 로드맵',openRoadmap,body);actionButton('백업 관리',backupManager,body)}
actionButton('NoteOn '+APP_VERSION,openReleaseInfo,$('#top .acts')).title='버전 · 사용 안내 · 변경 이력';
const originalRoadmapTexts=["<b>0 · 기능 범위 확정 · 이번 업데이트 완료</b><br>문서·표·일정·관계·백업에 다중 정렬, 행 템플릿, 통합 명령 메뉴까지 포함<br><b>완료 기준:</b> 이 범위로 기능 동결. 이후 새 기능은 1.0 필수 오류 해결에 필요한 경우만 추가", "<b>1 · 데이터 안정화 · 다음 작업</b><br>저장 실패·다중 탭 충돌·복원 경계값, 일괄 변경·관계·반복 일정의 정합성, 이전 백업 마이그레이션 종합 점검<br><b>완료 기준:</b> 데이터 유실·잘못된 행 변경 등 치명/높음 오류 0건. 백업→복원 및 실행 취소 회귀 시나리오 통과", "<b>2 · 사용성·성능 마감 · 예정</b><br>키보드 이동·초점·한글 입력·작은 화면·빈 상태 점검. 1,000행 표와 최대 5,000행 CSV 성능 측정 후 필요한 병목만 개선<br><b>완료 기준:</b> 주요 흐름에 막힘 없음. 측정 결과와 지원 범위 기록. 불필요한 기능 확장 없이 확인된 문제 수정", "<b>3 · 1.0 최종 배포 · 예정</b><br>전체 회귀·오프라인 실행·업데이트/백업 복구 연습, 버전 표시·변경 이력·최종 사용 안내 정리. Windows Chrome/Edge 실제 환경 확인<br><b>완료 기준:</b> 자동 검증과 실제 사용 환경 체크리스트 통과, 알려진 제한 명시 후 NoteOn.html 1.0 배포"];
const guideBeforeRelease=installFeatureGuide;
installFeatureGuide=function(){guideBeforeRelease();const home=db.blocks[db.guidePage];if(!home||pageLocked(home.id)||db.releaseGuideVersion)return;
 // Replace only recognized generated roadmap prose; preserve user additions and edits.
 const roadmap=home.content.map(id=>db.blocks[id]).find(b=>b?.type==='toggle'&&plain(T(b))==='NoteOn 1.0 완성 로드맵');
 if(roadmap){for(const id of roadmap.content){const b=db.blocks[id];if(!b||b.type!=='text')continue;const text=T(b);if(text.includes('현재는 종합 마감 검증 전이며 아직 1.0 완성 선언은 하지 않습니다.'))setT(b,text.replace('현재는 종합 마감 검증 전이며 아직 1.0 완성 선언은 하지 않습니다.','1.0 마감 검증을 완료했고 이후에는 유지보수로 전환합니다.'));for(const phase of NOTEON_ROADMAP)if(originalRoadmapTexts.includes(text)&&text.startsWith('<b>'+phase.phase+' · '))setT(b,'<b>'+phase.phase+' · '+phase.state+'</b><br>'+phase.work+'<br><b>완료 기준:</b> '+phase.gate)}}
 const section=addBlock(home.id,'toggle','NoteOn 1.0 · 사용 안내와 변경 이력',home.content.length);for(const [title,text] of RELEASE_NOTES)addBlock(section,'text','<b>'+esc(title)+'</b><br>'+esc(text),db.blocks[section].content.length);db.releaseGuideVersion=APP_VERSION;
};

const MAINTENANCE_NOTE='1.0.1: 한글 조합 중 Enter·Escape·단축키가 편집 구조나 창을 바꾸지 않도록 보호했습니다. 이름 변경 등 대화상자와 입력란에서 Backspace/Delete를 눌러도 뒤쪽 선택 블록이 삭제되지 않습니다. 잠긴 큰 표에서도 이전·다음 쪽을 읽을 수 있도록 수정했습니다. IME 이벤트 모의 검증을 포함하며 Windows 실기기·실제 입력기 검증은 별도입니다.';
RELEASE_NOTES.push(['1.0.1 유지보수 변경 이력',MAINTENANCE_NOTE]);
const guideBeforeMaintenance=installFeatureGuide;
installFeatureGuide=function(){guideBeforeMaintenance();const home=db.blocks[db.guidePage];if(!home||pageLocked(home.id)||db.maintenanceGuideVersion===APP_VERSION)return;const section=home.content.map(id=>db.blocks[id]).find(b=>b?.type==='toggle'&&plain(T(b))==='NoteOn 1.0 · 사용 안내와 변경 이력');if(section&&!section.content.some(id=>plain(T(db.blocks[id])).includes(MAINTENANCE_NOTE)))addBlock(section.id,'text',esc(MAINTENANCE_NOTE),section.content.length);db.maintenanceGuideVersion=APP_VERSION};

boot();

</script>
